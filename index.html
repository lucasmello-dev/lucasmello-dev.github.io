<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lembrei</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font: 400 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f5f6fa; color: #10131a; text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #0c0e14; color: #f2f4f8; } }
  main { max-width: 380px; }
  .mark { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .5; }
  h1 { font-size: 30px; font-weight: 700; margin: 14px 0 12px; }
  p { opacity: .75; }
</style>
</head>
<body>
<main>
  <p class="mark">Lembrei</p>
  <h1>Lembretes que sabem onde você está.</h1>
  <p>Esta página existe para abrir os convites do app. Se você chegou aqui por
  um link de convite, ele já deveria ter aberto — confira o endereço.</p>
</main>
</body>
</html>
